apiVersion: asset.sap/v1
kind: Asset

metadata:
  name: dmlt-consolidation-agent
  version: 1.0.0
  description: >
    Python A2A agent — validates JSON sections, runs deterministic calculations,
    generates AI findings, and produces Excel reports for DMLT consolidation studies.

type: agent

container:
  buildPath: .
  port: 5000

provides:
  apis:
    - name: dmlt-consolidation-agent
      kind: a2a
      ordId: customer.build:apiResource:dmlt-consolidation-3e4f0.dmlt-consolidation-agent:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
